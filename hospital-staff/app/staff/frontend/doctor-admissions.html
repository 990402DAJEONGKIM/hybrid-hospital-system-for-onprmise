<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입원 환자 관리 - 의사</title>
    <link rel="stylesheet" href="/css/fa-all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-wrap { max-width:1100px; margin:80px auto 40px; padding:0 16px; }
        .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
        .toolbar button { padding:8px 16px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
        .data-table { width:100%; border-collapse:collapse; font-size:13px; }
        .data-table th { background:#eceff1; padding:10px 12px; text-align:left; font-weight:600; color:#546e7a; border-bottom:2px solid #cfd8dc; }
        .data-table td { padding:9px 12px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
        .data-table tr:hover td { background:#f5f5f5; }
        .status-badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
        .status-ADMITTED          { background:#e8f5e9; color:#2e7d32; }
        .status-DISCHARGE_ORDERED { background:#fff8e1; color:#f57f17; }
        .action-btns { display:flex; gap:5px; flex-wrap:wrap; }
        .btn-xs { padding:4px 9px; border:none; border-radius:4px; font-size:11px; font-weight:600; cursor:pointer; }
        .btn-order { background:#fff8e1; color:#b45309; }
        .btn-order:disabled { opacity:.5; cursor:default; }
        .empty-msg { text-align:center; padding:40px; color:#90a4ae; }
        #errMsg { color:#e53935; font-size:13px; margin-bottom:10px; min-height:18px; }

        /* 퇴원 지시 확인 모달 */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:#fff; border-radius:12px; padding:0; max-width:480px; width:100%; overflow:hidden; display:flex; flex-direction:column; }
        .modal-header { padding:18px 22px 14px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { margin:0; font-size:16px; font-weight:800; color:#1e293b; }
        .modal-body { padding:18px 22px; font-size:14px; color:#374151; line-height:1.7; }
        .modal-footer { padding:12px 22px; border-top:1px solid #e2e8f0; display:flex; gap:10px; justify-content:flex-end; background:#f8fafc; }
        .modal-close { background:none; border:none; font-size:18px; cursor:pointer; color:#78909c; }
        .btn-do-order { padding:9px 20px; background:#f59e0b; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; }
        .btn-cancel-m { padding:9px 20px; background:#e2e8f0; color:#374151; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
    </style>
</head>
<body>
<div id="page-content">

<!-- 퇴원 지시 확인 모달 -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3><i class="fas fa-file-medical" style="margin-right:6px;color:#f59e0b;"></i>퇴원 지시</h3>
            <button class="modal-close" onclick="closeOrderModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
        <div class="modal-footer">
            <button class="btn-do-order" onclick="doOrderDischarge()"><i class="fas fa-check" style="margin-right:5px;"></i>퇴원 지시 확정</button>
            <button class="btn-cancel-m" onclick="closeOrderModal()">취소</button>
        </div>
    </div>
</div>

<div class="page-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <h2 style="margin:0;"><i class="fas fa-bed" style="margin-right:8px;color:#7c3aed;"></i>입원 환자 관리</h2>
        <button onclick="load()"><i class="fas fa-sync-alt" style="margin-right:4px;"></i>새로고침</button>
    </div>
    <p style="color:#78909c;font-size:13px;margin-bottom:18px;">담당 입원 환자 목록입니다. 퇴원 지시 후 간호사가 최종 퇴원 처리합니다.</p>

    <div id="errMsg"></div>

    <table class="data-table">
        <thead>
            <tr>
                <th>환자명</th>
                <th>병동</th>
                <th>병상</th>
                <th>입원 유형</th>
                <th>입원일시</th>
                <th>퇴원 예정일</th>
                <th>상태</th>
                <th>처리</th>
            </tr>
        </thead>
        <tbody id="admBody"></tbody>
    </table>
</div>
</div>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
<script src="js/layout.js"></script>
<script src="js/router.js"></script>
<script>
    let _orderAdmId = null;
    let _orderPatientName = null;

    const STATUS_LBL = {
        ADMITTED:          '입원중',
        DISCHARGE_ORDERED: '퇴원 지시됨',
    };
    const STATUS_CLS = {
        ADMITTED:          'status-ADMITTED',
        DISCHARGE_ORDERED: 'status-DISCHARGE_ORDERED',
    };
    const ROOM_TYPE_LBL = { single:'1인실', double:'2인실', shared:'다인실' };

    function _esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
        const me = await initLayout();
        if (!me) return;
        if (me.role !== 'doctor' && me.role !== 'admin') {
            document.getElementById('errMsg').textContent = '의사 권한이 필요합니다.';
            return;
        }
        await load();
    }

    async function load() {
        document.getElementById('errMsg').textContent = '';
        document.getElementById('admBody').innerHTML = `<tr><td colspan="8" class="empty-msg"><i class="fas fa-spinner fa-spin"></i> 조회 중...</td></tr>`;

        const res = await apiCall('/emr/doctor/admissions');
        if (!res || !res.ok) {
            document.getElementById('admBody').innerHTML = `<tr><td colspan="8" class="empty-msg">입원 환자 목록을 불러오지 못했습니다.</td></tr>`;
            return;
        }
        const list = await res.json();
        renderTable(list);
    }

    function renderTable(list) {
        const tbody = document.getElementById('admBody');
        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-msg">현재 담당 입원 환자가 없습니다.</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(a => {
            const statusLbl = STATUS_LBL[a.status] || a.status;
            const statusCls = STATUS_CLS[a.status] || '';
            const roomType  = ROOM_TYPE_LBL[a.room_type] || a.room_type || '-';
            const admittedAt = a.admitted_at ? a.admitted_at.replace('T',' ').slice(0,16) : '-';
            const canOrder   = a.status === 'ADMITTED';
            return `
            <tr>
                <td style="font-weight:600;">${_esc(a.patient_name || '—')}</td>
                <td>${_esc(a.ward_name || '-')}</td>
                <td>${_esc(a.room_number || '-')} <span style="font-size:11px;color:#94a3b8;">${_esc(roomType)}</span></td>
                <td>${_esc(a.department_code || '-')}</td>
                <td>${_esc(admittedAt)}</td>
                <td>${_esc(a.expected_discharge_date || '-')}</td>
                <td><span class="status-badge ${statusCls}">${_esc(statusLbl)}</span></td>
                <td><div class="action-btns">
                    <button class="btn-xs btn-order"
                        ${canOrder ? '' : 'disabled'}
                        onclick="openOrderModal('${_esc(a.admission_id)}','${_esc(a.patient_name || '—')}')">
                        <i class="fas fa-file-medical"></i> 퇴원 지시
                    </button>
                </div></td>
            </tr>`;
        }).join('');
    }

    function openOrderModal(admId, patientName) {
        _orderAdmId      = admId;
        _orderPatientName = patientName;
        document.getElementById('orderModalBody').innerHTML =
            `<strong>${_esc(patientName)}</strong> 환자에게 퇴원 지시를 내리겠습니까?<br>
            <span style="font-size:13px;color:#6b7280;">지시 후 간호사가 최종 퇴원 처리를 완료합니다.</span>`;
        document.getElementById('orderModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeOrderModal() {
        document.getElementById('orderModal').classList.remove('open');
        document.body.style.overflow = '';
        _orderAdmId = null;
        _orderPatientName = null;
    }

    async function doOrderDischarge() {
        if (!_orderAdmId) return;
        const admId = _orderAdmId;
        closeOrderModal();

        const res = await apiCall(`/emr/doctor/admissions/${admId}/order-discharge`, { method: 'PATCH' });
        if (res && res.ok) {
            await load();
        } else {
            const err = await res?.json().catch(() => ({}));
            document.getElementById('errMsg').textContent = err.detail || '퇴원 지시 처리 중 오류가 발생했습니다.';
        }
    }

    init();
</script>
</body>
</html>
